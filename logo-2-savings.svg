<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Green background: the brand color as the identity -->
  <rect width="512" height="512" rx="96" fill="#12b76a"/>

  <!-- Cart handle -->
  <path d="M 68,186 L 205,186" stroke="white" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- Cart basket -->
  <path d="M 205,186 L 425,186 L 398,340 L 205,340 Z"
        stroke="white" stroke-width="26" fill="none"
        stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="205" y1="186" x2="205" y2="340" stroke="white" stroke-width="26" stroke-linecap="round"/>

  <!-- Downward arrow inside basket: savings symbol -->
  <path d="M 315,222 L 315,300 M 275,268 L 315,310 L 355,268"
        stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wheels: dark for contrast -->
  <circle cx="258" cy="410" r="42" fill="#0d8f52"/>
  <circle cx="370" cy="410" r="42" fill="#0d8f52"/>
  <circle cx="258" cy="410" r="18" fill="#12b76a"/>
  <circle cx="370" cy="410" r="18" fill="#12b76a"/>
</svg>
