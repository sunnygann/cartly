name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version
        run: |
          DATE="$(date +'%Y.%m.%d')"
          SHA="$(git rev-parse --short HEAD)"
          VERSION="${DATE}.${SHA}"
          for f in *.html; do
            sed -i "s/%%VERSION%%/${VERSION}/g" "$f"
            sed -i "s/%%SHA%%/${SHA}/g" "$f"
          done
          echo "Version: ${VERSION}"

      - name: Deploy to Surge
        run: npx surge . cartly.surge.sh --token ${{ secrets.SURGE_TOKEN }}
