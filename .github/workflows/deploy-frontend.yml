name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version
        run: |
          DATE="$(date +'%Y.%m.%d')"
          SHA="$(git rev-parse --short HEAD)"
          COUNT=$(git log --oneline --since="$(date +'%Y-%m-%d')T00:00:00" HEAD | wc -l | tr -d ' ')
          PUSH_NUM=$(printf "%02d" "$COUNT")
          VERSION="${DATE}.${PUSH_NUM}.${SHA}"
          sed -i "s/%%VERSION%%/${VERSION}/g" index.html
          echo "Version: ${VERSION}"

      - name: Deploy to Surge
        run: npx surge . cartly.surge.sh --token ${{ secrets.SURGE_TOKEN }}
