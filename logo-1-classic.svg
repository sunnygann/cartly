<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#111917"/>

  <!-- Cart handle bar -->
  <path d="M 68,186 L 205,186" stroke="white" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- Cart basket outline (trapezoid: slightly wider at bottom) -->
  <path d="M 205,186 L 425,186 L 398,358 L 205,358 Z"
        stroke="white" stroke-width="26" fill="none"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Left vertical wall of basket -->
  <line x1="205" y1="186" x2="205" y2="358" stroke="white" stroke-width="26" stroke-linecap="round"/>

  <!-- Wheels: green brand accent -->
  <circle cx="258" cy="428" r="42" fill="#12b76a"/>
  <circle cx="370" cy="428" r="42" fill="#12b76a"/>

  <!-- Inner wheel ring (dark) for depth -->
  <circle cx="258" cy="428" r="18" fill="#111917"/>
  <circle cx="370" cy="428" r="18" fill="#111917"/>
</svg>
