<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background -->
  <rect width="512" height="512" rx="110" fill="#111917"/>

  <!--
    Cart reduced to pure geometry:
    — One horizontal bar (handle + basket top)
    — U-shape for basket body (open top, 3 walls)
    — Two green circles for wheels
    Maximum whitespace. Every stroke necessary, none extra.
  -->

  <!-- Handle bar + basket top: single horizontal line -->
  <path d="M 72,188 L 440,188"
        stroke="white" stroke-width="34" stroke-linecap="round" fill="none"/>

  <!-- Basket: left wall + bottom + right wall (open at top) -->
  <path d="M 168,188 L 168,352 L 412,352 L 412,188"
        stroke="white" stroke-width="34" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wheels: green — the only color, signals motion and the brand -->
  <circle cx="232" cy="428" r="40" fill="#12b76a"/>
  <circle cx="376" cy="428" r="40" fill="#12b76a"/>
</svg>
