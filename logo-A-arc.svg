<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background -->
  <rect width="512" height="512" rx="110" fill="#111917"/>

  <!--
    A single bold green arc — the "C" in Cartly.
    270° arc opening to the right. One element. Nothing else.
    Center: 256,256  Radius: 148
    Top terminal (−45°): 256+105, 256−105 = 361, 151
    Bottom terminal (+45°): 256+105, 256+105 = 361, 361
    Counterclockwise (sweep=0), large arc (flag=1).
  -->
  <path d="M 361,151 A 148,148 0 1 0 361,361"
        stroke="#12b76a" stroke-width="58" stroke-linecap="round" fill="none"/>

  <!-- Downward tick at bottom terminal: signals savings / price going down -->
  <path d="M 361,361 L 361,420 M 322,390 L 361,432 L 400,390"
        stroke="#12b76a" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
